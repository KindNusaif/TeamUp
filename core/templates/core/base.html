{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TeamUp{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
    <header>
        <h1>TeamUp</h1>
        <p>Find your people. Build your team. Join the challenge.</p>

        <nav aria-label="Main navigation">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'events' %}">Explore Events</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
       
      <p>Built for students who want to participate and learn.</p>
    </footer>
</body>
</html>
