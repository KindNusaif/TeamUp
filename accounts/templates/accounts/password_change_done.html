{% extends "core/base.html" %}

{% block title %}Password Changed | TeamUp{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card" style="text-align:center;">

        <div class="done-icon" style="margin-inline:auto;">✓</div>
        <h1 class="auth-card__title">Password updated!</h1>
        <p class="auth-card__subtitle" style="margin-inline:auto;">
            Your password has been changed successfully.<br>
            Use your new password next time you log in.
        </p>

        <a href="{% url 'home' %}" class="btn-form" style="margin-top:12px; text-decoration:none;">
            Back to homepage
        </a>

    </div>
</div>
{% endblock %}
